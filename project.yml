name: Klinker
options:
  bundleIdPrefix: com.klinker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: S9B9NM34C9
    CODE_SIGN_STYLE: Automatic
targets:
  Klinker:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: Klinker
        PRODUCT_BUNDLE_IDENTIFIER: com.klinker.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Klinker
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KlinkerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Klinker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.klinker.app.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Klinker.app/Klinker"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Klinker:
    build:
      targets:
        Klinker: all
        KlinkerTests: [test]
    test:
      targets:
        - KlinkerTests
